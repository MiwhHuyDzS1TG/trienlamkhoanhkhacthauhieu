<!-- FAKE DATA LOGIC -->
<script>
/* ================================
   FAKE DATA BAN ĐẦU
================================ */
const seedData = [
  { views: 90, likes: 15, comments: ["Nghe rất nhẹ.", "Đoạn cuối chạm thật."] },
  { views: 128, likes: 43, comments: ["Nghe lúc tối là hợp nhất."] },
  { views: 131, likes: 36, comments: ["Có đoạn phải dừng lại một chút."] },
  { views: 124, likes: 24, comments: ["Nghe mà suy nghĩ nhiều hơn."] },
  { views: 127, likes: 69, comments: ["Tuổi trẻ đúng là thứ khó nắm giữ."] }
];

document.querySelectorAll(".premium-card").forEach(card => {
  const id = Number(card.dataset.index);
  const key = "podcast_demo_" + id;

  /* ===== LOAD DATA ===== */
  let raw = localStorage.getItem(key);
  let data = raw ? JSON.parse(raw) : structuredClone(seedData[id]);
  localStorage.setItem(key, JSON.stringify(data));

  /* ===== ELEMENTS ===== */
  const audio = card.querySelector("audio");
  const viewsEl = card.querySelector(".views");
  const likeBtn = card.querySelector(".like-btn");
  const likeCount = card.querySelector(".like-count");
  const list = card.querySelector(".comment-list");
  const input = card.querySelector("input");
  const send = card.querySelector(".comment-input button");

  /* ===== RENDER ===== */
  function render() {
    viewsEl.textContent = `👁 ${data.views} lượt nghe`;
    likeCount.textContent = data.likes;
    list.innerHTML = "";
    data.comments.forEach(c => {
      const d = document.createElement("div");
      d.className = "comment";
      d.textContent = c;
      list.appendChild(d);
    });
  }
  render();

  /* ================================
     AUTO TĂNG VIEW KHI PLAY
     (CHỈ 1 LẦN / SESSION / BÀI)
  ================================ */
  let viewedThisSession = false;

  audio.addEventListener("play", () => {
    if (viewedThisSession) return;
    viewedThisSession = true;
    data.views++;
    localStorage.setItem(key, JSON.stringify(data));
    render();
  });

  /* ===== LIKE ===== */
  likeBtn.onclick = () => {
    data.likes++;
    localStorage.setItem(key, JSON.stringify(data));
    render();
  };

  /* ===== COMMENT ===== */
  send.onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    data.comments.unshift(text);
    input.value = "";
    localStorage.setItem(key, JSON.stringify(data));
    render();
  };
});
</script>
